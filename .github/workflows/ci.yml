name: ci

on:
  push:
    branches: [master, main, develop, test]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      web_image: ${{ steps.meta.outputs.web_image }}
      api_image: ${{ steps.meta.outputs.api_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image metadata
        id: meta
        run: |
          REPOSITORY="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="test-${GITHUB_SHA::7}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${REPOSITORY}/store-design-web:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${REPOSITORY}/store-design-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image
        run: docker build -t "${{ steps.meta.outputs.web_image }}" ./frontend
      - name: Build backend image
        run: docker build -t "${{ steps.meta.outputs.api_image }}" ./backend
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.web_image }}"
          docker push "${{ steps.meta.outputs.api_image }}"

  deploy-test:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'test'))
    environment: test
    steps:
      - name: Deploy to test server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ vars.DEPLOY_DIR }}"
            PROJECT_NAME="${{ vars.COMPOSE_PROJECT_NAME }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="/opt/store_design_test"; fi
            if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="store_design_test"; fi

            cd "$DEPLOY_DIR"
            test -f docker-compose.yml

            cat > .env <<'STORE_DESIGN_ENV'
            ${{ secrets.ENV_FILE }}
            STORE_DESIGN_ENV
            grep -v -E '^(WEB_IMAGE|API_IMAGE|IMAGE_TAG)=' .env > .env.tmp || true
            mv .env.tmp .env
            {
              printf '\n'
              printf 'WEB_IMAGE=%s\n' '${{ needs.docker-build.outputs.web_image }}'
              printf 'API_IMAGE=%s\n' '${{ needs.docker-build.outputs.api_image }}'
              printf 'IMAGE_TAG=%s\n' '${{ needs.docker-build.outputs.image_tag }}'
            } >> .env

            if [ -n '${{ secrets.GHCR_TOKEN }}' ]; then
              GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}'
              if [ -z "$GHCR_USERNAME" ]; then GHCR_USERNAME='${{ github.actor }}'; fi
              printf '%s' '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            docker-compose --project-name "$PROJECT_NAME" pull
            docker-compose --project-name "$PROJECT_NAME" up -d
            docker image prune -f
            docker-compose --project-name "$PROJECT_NAME" ps
      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL is not set, skipping health check."
            exit 0
          fi
          curl -fsS "$HEALTHCHECK_URL"
