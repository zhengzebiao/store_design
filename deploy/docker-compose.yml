services:
  store-design-web:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8000
      BASENAME: /store_design
    ports:
      - "8080:80"
    depends_on:
      - store-design-api

  store-design-api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://store_design:store_design@store-design-postgres:5432/store_design}
    ports:
      - "8000:8000"
    depends_on:
      - store-design-postgres

  store-design-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_design}
      POSTGRES_USER: ${POSTGRES_USER:-store_design}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_design}
    volumes:
      - store_design_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  store_design_pgdata:
